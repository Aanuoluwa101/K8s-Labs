apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: kafka-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: kafka-clients:1
          imagePullPolicy: Never   # use the image built inside minikube; never try to pull it
          command: ["python", "/app/producer.py"]
          env:
            - name: PYTHONUNBUFFERED   # print logs immediately
              value: "1"
            - name: BOOTSTRAP
              value: "kafka:9092"
            - name: TOPIC
              value: "orders"
            - name: RATE
              value: "2"
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: kafka-clients
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: kafka-lab
spec:
  replicas: 2                      # 2 members of the same group
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: kafka-clients:1
          imagePullPolicy: Never   # use the image built inside minikube; never try to pull it
          command: ["python", "/app/consumer.py"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: BOOTSTRAP
              value: "kafka:9092"
            - name: TOPIC
              value: "orders"
            - name: GROUP
              value: "scoring"
            - name: PROCESS_MS
              value: "0"
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: kafka-clients