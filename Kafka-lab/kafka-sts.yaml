apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka # pods become kafka-0, kafka-1, kafka-2. DNS name from here too <pod-name>.<serviceName>.<namespace>.svc
  namespace: kafka-lab
spec:
  serviceName: kafka # must match headless service metadata.name
  replicas: 3
  podManagementPolicy: Parallel   # start all 3 together; quorum needs 2 of 3 up at once
  selector:
    matchLabels:
      app: kafka 
  template:
    metadata:
      labels:
        app: kafka 
    spec:
      enableServiceLinks: false   # stops K8s injecting KAFKA_PORT etc., which cp-kafka rejects
      securityContext:
        fsGroup: 1000             # cp-kafka runs as uid 1000; lets it write to the volume
      containers:
        - name: kafka # only the container's name inside the pod, doesn't affect pod names e.g kubectl logs kafka-0 -c broker
          image: confluentinc/cp-kafka:8.0.0
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller
          # Per-pod values can't be static env vars, so derive them from the pod name (kafka-0 → 0)
          command:
            - bash
            - -c
            - |
              export KAFKA_NODE_ID=${HOSTNAME##*-}
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka.kafka-lab.svc.cluster.local:9092"
              exec /etc/confluent/docker/run
          env:
            # ---- identity & quorum ----
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka.kafka-lab.svc.cluster.local:9093,1@kafka-1.kafka.kafka-lab.svc.cluster.local:9093,2@kafka-2.kafka.kafka-lab.svc.cluster.local:9093"
            # ---- listeners ----
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # ---- replication defaults for the drills ----
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            # ---- storage & memory ----
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data/logs"   # subfolder avoids a 'lost+found' dir at the volume root
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: 
            storage: 1Gi
