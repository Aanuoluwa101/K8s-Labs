apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: lab-store
  namespace: db
spec:
  retentionPolicy: "7d"
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
  configuration:
    destinationPath: s3://k8s-postgres-lab/
    endpointURL: https://lr8r6hprseor.compat.objectstorage.uk-london-1.oraclecloud.com
    s3Credentials:
      accessKeyId:
        name: backup-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: backup-creds
        key: ACCESS_SECRET_KEY
      region:
        name: backup-creds
        key: REGION
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lab
  namespace: db
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  bootstrap:
    initdb:
      database: app
      owner: app
  postgresql:
    parameters:
      shared_buffers: "128MB"
      max_connections: "100"
    synchronous:
      method: any
      number: 1
      dataDurability: required
      failoverQuorum: true
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    size: 1Gi
  walStorage:
    size: 1Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: lab-store
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: lab-daily
  namespace: db
spec:
  schedule: "0 0 2 * * *"   # six fields, seconds first: 02:00:00 every day
  immediate: true            # also take one right now
  backupOwnerReference: self
  cluster:
    name: lab
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io