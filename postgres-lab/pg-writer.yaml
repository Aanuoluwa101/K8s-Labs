apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: db
spec:
  containers:
    - name: writer
      image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
      command: ["sh", "-c"]
      args:
        - |
          while true; do
            if psql -qtAc "INSERT INTO ticks DEFAULT VALUES" >/dev/null 2>&1; then
              echo "$(date +%T) ok"
            else
              echo "$(date +%T) FAIL"
            fi
            sleep 1
          done
      env:
        - name: PGHOST
          value: lab-pooler-rw
        - name: PGCONNECT_TIMEOUT
          value: "2"
        - name: PGUSER
          valueFrom: { secretKeyRef: { name: lab-app, key: username } }
        - name: PGPASSWORD
          valueFrom: { secretKeyRef: { name: lab-app, key: password } }
        - name: PGDATABASE
          valueFrom: { secretKeyRef: { name: lab-app, key: dbname } }