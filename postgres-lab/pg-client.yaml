apiVersion: v1
kind: Pod
metadata:
  name: pg-client
spec:
  containers:
    - name: client
      image: postgres:16-alpine
      command: ["sleep", "infinity"]   # don't start a server, just stay alive
      env:
        - name: PGHOST
          value: postgres-0.postgres
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB